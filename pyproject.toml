[project]
name = "real-time-multistage-recommender"
version = "0.1.0"
description = "Interview-ready real-time multi-stage recommendation system with retrieval, ranking, re-ranking, MLOps docs, and Render deployment."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
train = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3",
  "faiss-cpu>=1.8,<2",
]
test = [
  "httpx>=0.27,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

